name: Build Android APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Setup Expo (Prebuild)
        run: npx expo prebuild --platform android
        env:
          EXPO_PUBLIC_SUPABASE_URL: "https://ygyphebainyngkbnagae.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlneXBoZWJhaW55bmdrYm5hZ2FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTA1NDUsImV4cCI6MjA5OTE2NjU0NX0._7rY4n7MeYoaKHeWP6bF3NUXH99bFCqypQSEKjvRJaI"

      - name: 🚀 Build APK (Release)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lemburin-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
